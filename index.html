<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Agent Office</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l7 4-7 4-7-4z' fill='%23e3c27a'/%3E%3Cpath d='M1 5v6l7 4V9z' fill='%238e5f35'/%3E%3Cpath d='M15 5v6l-7 4V9z' fill='%23b07a47'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="hud">
      <span class="brand">Agent Office</span>
      <span id="conn" class="conn" title="connecting..."></span>
      <span id="source" class="muted"></span>
      <span id="stats" class="stats"></span>
      <span class="spacer"></span>
      <span class="legend">
        <i style="background: #4fc3f7"></i>working <i style="background: #9ccc65"></i>idle <i style="background: #ffca28"></i>needs you
      </span>
      <button id="reset-view" type="button">reset view</button>
      <button id="inbox-btn" type="button">inbox <b id="inbox-badge" hidden>0</b></button>
    </header>
    <div id="sim-banner" class="sim-banner" hidden>
      Simulation mode - these agents are fake. Set <code>OPENCODE_URLS</code> to connect your opencode servers.
    </div>
    <canvas id="office" aria-label="Isometric office with AI agents. Click an agent to open its terminal."></canvas>
    <div id="windows"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
